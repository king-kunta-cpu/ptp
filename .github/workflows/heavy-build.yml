name: cedar-heavy
on:
  repository_dispatch:
    types: [cedar-heavy-build]
  schedule:
    - cron: '0 22 * * 5'  # Fri 22 UTC = Sat 00:00 Harare
    - cron: '0 22 * * 6'  # Sat 22 UTC = Sun 00:00 Harare
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of ideas to generate'
        required: false
        default: '30'

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install deps
        run: npm install googleapis groq-sdk || npm install googleapis
        
      - name: Heavy build batch
        run: node cedar-loom/heavy-build.js --count=${{ github.event.client_payload.count || inputs.count || 30 }}
        env:
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
          SHEETS_SERVICE_JSON: ${{ secrets.SHEETS_SERVICE_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COUNT: ${{ github.event.client_payload.count || inputs.count || 30 }}
          TZ: ${{ github.event.client_payload.tz || 'Africa/Harare' }}

      - name: Build landings (1 commit batch)
        run: |
          if [ -d "cedar-loom-landings" ]; then
            echo "Landings generated: $(ls cedar-loom-landings | wc -l)"
            # Copy to docs or gh-pages branch if you use GitHub Pages
            mkdir -p docs/landings
            cp cedar-loom-landings/*.html docs/landings/ 2>/dev/null || true
          fi

      - name: Commit landings batch
        run: |
          git config user.name "Cedar Loom Bot"
          git config user.email "cedar@atomicmail.io"
          git add docs/landings/ cedar-loom-landings/ || true
          git diff --staged --quiet || git commit -m "feat: batch landings ${{ github.event.client_payload.count || inputs.count || 30 }} - $(date -u +%Y-%m-%d) - high-converting + aggressive CTA + psych triggers"
          git push || echo "No push needed"

      - name: Notify Cloudflare Worker
        if: always()
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_WORKER_URL }}" ]; then
            curl -X POST ${{ secrets.CLOUDFLARE_WORKER_URL }}/v1/hook/github \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"${{ job.status }}\",\"count\":${{ github.event.client_payload.count || inputs.count || 30 }},\"tz\":\"Africa/Harare\",\"run_id\":\"${{ github.run_id }}\"}"
          fi
