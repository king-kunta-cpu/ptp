name = "cedar-loom"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0c6059d950fad268faa25cbb6d21ef77"

# KV id is filled at deploy time (wrangler kv namespace create CL)
kv_namespaces = [
  { binding = "CL", id = "__KV_ID__" }
]

[vars]
TZ = "Africa/Harare"
GH_REPO = "king-kunta-cpu/ptp"

# Secrets (set via wrangler secret put, never in this file):
#   BRIDGE_SECRET COINOS_API_BASE COINOS_API_KEY COINOS_INVOICE_PATH
#   COINOS_WEBHOOK_SECRET WEB_APP_URL
