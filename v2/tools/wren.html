<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SemVer Changelog Generator — Wren</title>
<style>
body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0d1117;color:#e6edf3;margin:0;padding:24px}
main{max-width:900px;margin:0 auto}h1{font-size:22px}p.tag{color:#8b949e}
textarea{background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:10px;border-radius:6px;width:100%;box-sizing:border-box;font:inherit;min-height:180px}
label{display:block;margin:10px 0 4px;font-size:13px;color:#8b949e}
button{background:#238636;border:0;color:#fff;padding:10px 18px;border-radius:6px;font:inherit;cursor:pointer;margin-top:14px}
button.alt{background:#21262d;border:1px solid #30363d}
pre{background:#161b22;border:1px solid #30363d;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5}
.foot{margin-top:28px;font-size:12px;color:#8b949e;border-top:1px solid #21262d;padding-top:12px}
a{color:#58a6ff}.hidden{display:none}.warn{color:#f0883e;font-size:12px}
</style></head><body><main>
<h1>SemVer Changelog Generator</h1>
<p class="tag">Paste conventional-commit history → changelog, version bump, breaking-change notice. Free tool by Wren.</p>
<label>Current version (e.g. 1.4.2)</label><input id="cur" value="1.4.2" style="background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:8px;border-radius:6px;font:inherit;width:200px">
<label>Commit list (one per line, conventional commits)</label>
<textarea id="commits">feat: add retry queue for flaky upstreams
fix: honor TZ in scheduled jobs
feat!: drop support for Node 16
perf: cache schema lookups
chore: bump deps, tidy changelog
fix: handle empty cursor on pagination</textarea>
<button onclick="gen()">Generate</button>
<p id="warn" class="warn hidden"></p>
<pre id="out" class="hidden"></pre>
<div id="btns" class="hidden"><button class="alt" onclick="copy()">Copy</button><button class="alt" onclick="dl()">Download .md</button></div>
<p class="foot">Free tool by Wren — webdev kits &amp; open source maintenance · Custom builds: <a href="mailto:CONTACT" id="ce">CONTACT</a> · <a href="lightning:SharkSkin@coinos.io">Buy me a coffee ⚡</a></p>
<script>
var CONTACT="CONTACT"; // SETUP: replace with persona mailbox
document.getElementById('ce').textContent=CONTACT;
document.getElementById('ce').href="mailto:"+CONTACT;
var groups={Added:[],Changed:[],Fixed:[],Performance:[],Breaking:[],Chore:[]};
var parseMap={feat:'Added',fix:'Fixed',perf:'Performance',refactor:'Changed',docs:'Chore',style:'Chore',test:'Chore',build:'Chore',ci:'Chore',chore:'Chore',revert:'Changed'};
function bump(cur){
 var m=String(cur).match(/(\d+)\.(\d+)\.(\d+)/);
 if(!m)return{v:"1.0.0",note:"couldn't parse current version — assuming 1.0.0"};
 var a=+m[1],b=+m[2],c=+m[3];
 if(groups.Breaking.length){a++;b=0;c=0;return{v:a+"."+b+"."+c,note:"major (breaking change detected)"};}
 if(groups.Added.length){b++;c=0;return{v:a+"."+b+"."+c,note:"minor (new feature)"};}
 if(groups.Fixed.length||groups.Performance.length||groups.Changed.length){c++;return{v:a+"."+b+"."+c,note:"patch (fixes/changes)"};}
 return{v:a+"."+b+"."+c,note:"patch (housekeeping)"};
}
var lastMd="";
function gen(){
 var lines=document.getElementById('commits').value.split(/\n/).map(function(s){return s.trim();}).filter(Boolean);
 Object.keys(groups).forEach(function(k){groups[k]=[];});
 var skipped=0;
 lines.forEach(function(line){
  var m=line.match(/^(\w+)(!)?\s*(?:\[[^\]]*\]\s*)?:\s*(.+)$/);
  if(!m){skipped++;return;}
  var type=m[1].toLowerCase(),breaking=!!m[2],msg=m[3];
  if(breaking)groups.Breaking.push(msg);
  var g=parseMap[type];
  if(g&&g!=='Breaking')groups[g].push(msg);
  else if(!g)groups.Chore.push(line);
 });
 var bv=bump(document.getElementById('cur').value);
 var date=new Date().toISOString().slice(0,10);
 var w=document.getElementById('warn');
 if(skipped){w.textContent="skipped "+skipped+" non-conventional line(s) (treated as chore if they matched nothing)";w.classList.remove('hidden');}else{w.classList.add('hidden');}
 var L=["# Changelog","","## ["+bv.v+"] — "+date,""];
 var sec=["Breaking","Added","Changed","Fixed","Performance","Chore"];
 sec.forEach(function(s){
  if(!groups[s].length)return;
  L.push("### "+s);
  groups[s].forEach(function(x){L.push("- "+x);});
  L.push("");
 });
 L.push("## Release notes","");
 L.push("Bump: "+document.getElementById('cur').value+" → **"+bv.v+"** ("+bv.note+")");
 L.push("");
 if(groups.Breaking.length){
  L.push("### ⚠️ Breaking-change notice (paste into release announcement)","");
  L.push("This release is a **major** version. Upgrade carefully:");
  groups.Breaking.forEach(function(x){L.push("- **"+x+"** — migrate before upgrading; old API removed.");});
  L.push("");
  L.push("Migration: see the diff of v"+document.getElementById('cur').value+" → v"+bv.v+". If you maintain a dependent package, pin until you have verified the new behavior in CI.");
 }
 lastMd=L.join("\n");
 var o=document.getElementById('out');o.textContent=lastMd;o.classList.remove('hidden');
 document.getElementById('btns').classList.remove('hidden');
}
function copy(){navigator.clipboard.writeText(lastMd);}
function dl(){var b=new Blob([lastMd],{type:"text/markdown"});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download="CHANGELOG.md";a.click();}
</script></body></html>
